<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset=".55" stop-color="#3b6cf6"/>
      <stop offset="1" stop-color="#2f7bf0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".28" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#141a4a" flood-opacity="0.38"/>
    </filter>
    <filter id="echoBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#sheen)"/>

  <!-- echo N (the second Nook) -->
  <g transform="translate(296,266)" filter="url(#echoBlur)">
    <path d="M0,460 V0 H118 L342,296 V0 H460 V460 H342 L118,164 V460 Z" fill="#c3d6ff" opacity=".35"/>
  </g>

  <!-- main N (the first Nook) -->
  <g transform="translate(282,322)" filter="url(#soft)">
    <path d="M0,460 V0 H118 L342,296 V0 H460 V460 H342 L118,164 V460 Z" fill="#ffffff"/>
  </g>

  <rect x="4" y="4" width="1016" height="1016" rx="224" fill="none"
        stroke="#ffffff" stroke-opacity=".20" stroke-width="6"/>
</svg>